name: ANA — Activity Feed Catchup

on:
  schedule:
    # Every 5 minutes. Re-enabled 2026-09-16 after a manual catch-up (run with this
    # schedule paused, to avoid racing it — see project_ana_activity_feed_bugs memory)
    # brought the cursor from LAUNCH_FLOOR_BLOCK up past current. Steady-state scans are
    # small (one WINDOW's worth of new blocks per tick), which is much less exposed to
    # the free-RPC silent-empty-result issue than the marathon historical sweep was.
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  catchup:
    name: Advance the on-chain activity scan cursor
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: GET /api/activity/events
        run: |
          STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            "${{ vars.ANA_APP_URL }}/api/activity/events")
          echo "HTTP $STATUS"
          cat /tmp/response.json | python3 -m json.tool 2>/dev/null || cat /tmp/response.json
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "Activity catchup failed with HTTP $STATUS"
            exit 1
          fi
