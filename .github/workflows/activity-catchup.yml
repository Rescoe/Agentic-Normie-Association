name: ANA — Activity Feed Catchup

on:
  schedule:
    # Was every 5 minutes (288 Neon touches/day) -- porteur's explicit cost call
    # (25/09): this is by far the most frequent trigger in the whole app, more
    # than salon-exchange (30min) or check-burns (was 15min). 20 minutes still
    # keeps the cursor comfortably ahead of ever needing the expensive
    # historical-sweep fallback (see project_ana_activity_feed_bugs memory)
    # -- nothing here has a budget tighter than hours, not minutes.
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  catchup:
    name: Advance the on-chain activity scan cursor
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: GET /api/activity/events
        run: |
          STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            "${{ vars.ANA_APP_URL }}/api/activity/events")
          echo "HTTP $STATUS"
          cat /tmp/response.json | python3 -m json.tool 2>/dev/null || cat /tmp/response.json
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "Activity catchup failed with HTTP $STATUS"
            exit 1
          fi
