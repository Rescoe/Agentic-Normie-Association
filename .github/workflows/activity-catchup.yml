name: ANA — Activity Feed Catchup

on:
  schedule:
    # Every 5 minutes — WINDOW was cut down to 25 000 blocks (~14h of chain time)
    # to stay well clear of public-RPC rate limits (see route.ts's RPC_CONCURRENCY
    # comment), so catching up the multi-million-block backlog to LAUNCH_FLOOR_BLOCK
    # needs many more ticks than before. Each run only takes ~15-20s, so 5-minute
    # cadence is cheap; still a no-op once caught up.
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  catchup:
    name: Advance the on-chain activity scan cursor
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: GET /api/activity/events
        run: |
          STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            "${{ vars.ANA_APP_URL }}/api/activity/events")
          echo "HTTP $STATUS"
          cat /tmp/response.json | python3 -m json.tool 2>/dev/null || cat /tmp/response.json
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "Activity catchup failed with HTTP $STATUS"
            exit 1
          fi
