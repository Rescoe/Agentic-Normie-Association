name: ANA — Activity Feed Catchup

on:
  # TEMPORARILY DISABLED (2026-09-16): the route's read-modify-write cache update has a
  # narrow race window (fresh-read-then-write, no DB-level atomicity yet) that a concurrent
  # cron tick can still hit during a manual catch-up push, silently dropping accumulated
  # events. Paused here so the manual catch-up has sole access to the cache key while it
  # finishes recovering the events lost to that race. RE-ENABLE the `schedule:` block below
  # once the manual catch-up is confirmed complete (see project memory
  # project_ana_activity_feed_bugs for the full story) — don't leave this off long-term,
  # steady-state relies on this cron once caught up.
  # schedule:
  #   - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  catchup:
    name: Advance the on-chain activity scan cursor
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: GET /api/activity/events
        run: |
          STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            "${{ vars.ANA_APP_URL }}/api/activity/events")
          echo "HTTP $STATUS"
          cat /tmp/response.json | python3 -m json.tool 2>/dev/null || cat /tmp/response.json
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "Activity catchup failed with HTTP $STATUS"
            exit 1
          fi
