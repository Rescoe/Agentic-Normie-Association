name: ANA — Activity Feed Catchup

on:
  schedule:
    # Every 30 minutes — GET /api/activity/events only advances its scan cursor
    # by WINDOW (100 000 blocks, ~55h of chain time) per call and is otherwise
    # a no-op once caught up, so this cadence is generous in both directions:
    # fast enough to clear a large backlog in a few hours, cheap to poll when idle.
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  catchup:
    name: Advance the on-chain activity scan cursor
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: GET /api/activity/events
        run: |
          STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            "${{ vars.ANA_APP_URL }}/api/activity/events")
          echo "HTTP $STATUS"
          cat /tmp/response.json | python3 -m json.tool 2>/dev/null || cat /tmp/response.json
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "Activity catchup failed with HTTP $STATUS"
            exit 1
          fi
