name: ANA — Activity Feed Catchup

on:
  # Schedule removed (Sept 2026 pérennisation pass) — orchestrator.yml now
  # calls GET /api/activity/events every 30 min (every orchestrator tick) as
  # part of its own consolidated schedule (see /api/keeper/orchestrator).
  # Kept as workflow_dispatch only, for manual triggering/testing.
  workflow_dispatch:

jobs:
  catchup:
    name: Advance the on-chain activity scan cursor
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: GET /api/activity/events
        run: |
          STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            "${{ vars.ANA_APP_URL }}/api/activity/events")
          echo "HTTP $STATUS"
          cat /tmp/response.json | python3 -m json.tool 2>/dev/null || cat /tmp/response.json
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "Activity catchup failed with HTTP $STATUS"
            exit 1
          fi
