name: ANA — Neon Keep-Alive

on:
  # Schedule removed (Sept 2026 pérennisation pass) — orchestrator.yml now
  # pings GET /api/health once a day at 00:00 UTC as part of its own
  # consolidated schedule (see /api/keeper/orchestrator) — daily is far more
  # than enough margin under Neon's 28-day archiving window, and it no longer
  # needs its own independent trigger. Kept as workflow_dispatch only, for
  # manual triggering/testing, and as a standalone fallback the porteur can
  # re-enable a schedule on if the orchestrator itself is ever broken.
  workflow_dispatch:

jobs:
  ping:
    name: Ping Neon to prevent branch archiving
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: GET /api/health
        run: |
          STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            "${{ vars.ANA_APP_URL }}/api/health")
          echo "HTTP $STATUS"
          cat /tmp/response.json | python3 -m json.tool 2>/dev/null || cat /tmp/response.json
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "Neon health check failed with HTTP $STATUS"
            exit 1
          fi
