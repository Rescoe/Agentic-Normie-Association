name: ANA — Check Burns

on:
  schedule:
    # Every 15 min — detection itself is part of the ~4h burn -> vote ->
    # display budget (see work-lifecycle's cascade for the rest), so it can't
    # sit on a once-a-day cadence. The check itself is a single cheap
    # totalSupply() read + a Neon comparison — no LLM call unless a burn is
    # actually found, so frequent polling costs almost nothing.
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  check-burns:
    name: Detect burned Normies
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: POST /api/keeper/check-burns
        run: |
          STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST "${{ vars.ANA_APP_URL }}/api/keeper/check-burns" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.ANA_CRON_SECRET }}" \
            -d '{}')
          echo "HTTP $STATUS"
          cat /tmp/response.json | python3 -m json.tool 2>/dev/null || cat /tmp/response.json
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "Burns check failed with HTTP $STATUS"
            exit 1
          fi
